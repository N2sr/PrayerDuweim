name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          yes | cmdline-tools/latest/bin/sdkmanager --licenses
          cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.3"
      - name: Create project structure
        env:
          ANDROID_HOME: ${{ env.HOME }}/android-sdk
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/duweim/prayerduweim
          mkdir -p app/src/main/res/values
          cp index.html app/src/main/assets/
          cp MainActivity.java app/src/main/java/com/duweim/prayerduweim/
          cp AndroidManifest.xml app/src/main/
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">أذان الدويم</string>
          </resources>
          EOF
      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.HOME }}/android-sdk
        run: |
          cd app
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
