name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create project structure
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/duweim/prayerduweim
          mkdir -p app/src/main/res/values
          cp index.html app/src/main/assets/
          cp MainActivity.java app/src/main/java/com/duweim/prayerduweim/
          cp AndroidManifest.xml app/src/main/
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">أذان الدويم</string>
          </resources>
          EOF
      - name: Build APK
        run: |
          cd app
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
